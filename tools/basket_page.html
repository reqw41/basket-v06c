<!doctype html><html><head><meta charset="utf-8"><title>Basket Master — Vector-06c Z80</title>
<style>
html,body{background:#111;color:#ccc;font-family:monospace;text-align:center;margin:0;padding:8px}
#canvasdiv{margin:auto;width:100vw;height:75vw;max-height:100vh;max-width:133.33vh;border:1px solid #444;background:#000}
#canvas{width:100%;height:100%;image-rendering:pixelated;display:block;outline:none;cursor:pointer}
#status{margin-top:8px;font-size:13px}
.hint{color:#888;font-size:12px;margin-top:6px;line-height:1.7}
button{background:#333;color:#eee;border:1px solid #555;border-radius:4px;padding:5px 12px;font-family:monospace;cursor:pointer}
</style></head>
<body tabindex="0">
<div id="canvasdiv"><canvas id="canvas" width="576" height="288"></canvas></div>
<h3 style="margin:4px">Basket Master Executive · Z80 · CPC 4-colour</h3>
<div id="status">загрузка…</div>
<div class="hint">стрелки / пробел · клик по экрану для звука</div>
<button onclick="location.reload()">перезагрузить</button>
<script src="i8080-js/i8080_trace.js"></script><script src="i8080-js/i8080_disasm.js"></script>
<script src="i8080-js/i8080.js"></script><script src="src/fili.js"></script><script src="src/ay.js"></script>
<script src="src/fd1793.js"></script><script src="src/fddimage.js"></script><script src="src/i8253.js"></script>
<script src="src/io.js"></script><script src="src/keyboard.js"></script><script src="src/memory.js"></script>
<script src="src/sound.js"></script><script src="src/tv.js"></script>
<script src="Z80_v06.js"></script><script src="z80_adapter.js"></script>
<script>
window.onerror=function(m,s,l,c,e){document.getElementById('status').textContent='ОШИБКА: '+m+' @'+l;return false;};
const memory=new Memory(),keyboard=new Keyboard(),timer=new I8253(),ay=new AY();
const floppy=new (Floppy().FD1793)(); const io=new IO(keyboard,timer,memory,ay,floppy);
const cpu=new I8080(memory,io); const tape={advance:()=>{},sample:0,reset:()=>{}};
const v06c=new Vector06c(cpu,memory,io,ay,tape);
window.v06c=v06c; v06c.check_breakpoint=()=>false; v06c.dbg=null;
function grabFocus(){ try{ document.body.focus({preventScroll:true}); document.getElementById('canvas').focus({preventScroll:true}); }catch(e){} }
document.getElementById('canvas').tabIndex=0;
document.body.addEventListener('pointerdown', grabFocus);
(function unlockAudio(){
  function go(){ const s=v06c.soundnik; if(s&&s.restart) s.restart(); }
  ['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev, go, {capture:true}));
})();
function nz(lo,hi){ let n=0; for(let a=lo;a<hi;a++) if(memory.read(a,false)) n++; return n; }
(async function(){
  const romName=new URLSearchParams(location.search).get('rom')||'basket.rom';
  const resp=await fetch(romName+'?t='+Date.now());
  if(!resp.ok){ document.getElementById('status').textContent='нет '+romName; return; }
  const img=new Uint8Array(await resp.arrayBuffer());
  const base=img.length===65536?0:0x100;
  for(let i=0;i<img.length&&base+i<0x10000;i++) memory.write(base+i, img[i], false);
  memory.detach_boot&&memory.detach_boot();
  cpu.pc=0x100; cpu.sp=0x7FFE; cpu.iff=false;
  timer.Write(3,0x36); timer.Write(3,0x76); timer.Write(3,0xB6);
  keyboard.Hook();
  let f=0;
  v06c.onframeskip=function(){
    if((f++%25)===0){
      document.getElementById('status').textContent=
        romName+' · f '+f+' · pc '+cpu.pc.toString(16)+
        ' · colour '+nz(0xC000,0xE000)+'/'+nz(0xE000,0x10000);
    }
  };
  document.getElementById('status').textContent=romName+' Z80';
  grabFocus();
  v06c.oneFrame();
})();
</script></body></html>
