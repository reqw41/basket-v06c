<!DOCTYPE HTML>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <title>Basket Master - Vector-06C Z80 Mode</title>
    <style>
    body {
        padding: 0;
        margin: 0;
        background-color: #111;
        color: #fff;
        font-family: sans-serif;
    }
    
    #canvasdiv {
        margin: 20px auto;
        width: 512px;
        height: 384px;
        border: 4px solid #333;
    }
    
    #canvas {
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
    }
    
    #debug {
        margin: 20px auto;
        width: 512px;
        font-family: monospace;
        font-size: 12px;
        background: #222;
        padding: 10px;
        border-radius: 4px;
    }
    
    #debug .label {
        color: #888;
    }
    
    #debug .value {
        color: #0f0;
    }
    
    .controls {
        text-align: center;
        margin: 10px;
    }
    
    button {
        padding: 8px 16px;
        margin: 4px;
        font-size: 14px;
        cursor: pointer;
    }
    </style>
</head>

<body>
    <div class="controls">
        <button onclick="toggleRun()">Start/Stop</button>
        <button onclick="stepFrame()">Step Frame</button>
        <button onclick="reset()">Reset</button>
    </div>
    
    <div id="canvasdiv">
        <canvas id="canvas" width="512" height="384"></canvas>
    </div>
    
    <div id="debug">
        <div><span class="label">PC:</span> <span class="value" id="dbg-pc">0000</span></div>
        <div><span class="label">SP:</span> <span class="value" id="dbg-sp">0000</span></div>
        <div><span class="label">Frames:</span> <span class="value" id="dbg-frames">0</span></div>
        <div><span class="label">Soft VRAM (8000-BFFF) non-zero:</span> <span class="value" id="dbg-vram">0</span></div>
        <div><span class="label">Visible plane (E000-FFFF) non-zero:</span> <span class="value" id="dbg-plane">0</span></div>
        <div><span class="label">Status:</span> <span class="value" id="dbg-status">Loading...</span></div>
    </div>

    <!-- i8080 base (for Memory/IO classes) -->
    <script language="JavaScript" src="./i8080-js/i8080.js" type="text/javascript"></script>
    <script src="./i8080-js/i8080_disasm.js" type="application/x-javascript"></script>
    <script language="JavaScript" src="./src/memory.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/io.js?v=joyport1" type="text/javascript"></script>
    <script language="JavaScript" src="./src/tv.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/hooks.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/keyboard.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/i8253.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/ay.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/rom.js" type="text/javascript"></script>
    <script src="src/debugger.js" type="text/javascript" charset="utf-8"></script>
    <script language="JavaScript" src="./src/fili.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/sound.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/fd1793.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/fddimage.js" type="text/javascript"></script>
    <script language="JavaScript" src="./src/wavplayer.js" type="text/javascript"></script>
    <script language="JavaScript" src="./zip.js/WebContent/zip.js" type="text/javascript"></script>
    <script language="JavaScript" src="./wav.js/wav.js" type="text/javascript"></script>
    
    <!-- Z80 core and adapter - MUST come before main.js -->
    <script src="./Z80_v06.js" type="text/javascript"></script>
    <script src="./z80_adapter.js" type="text/javascript"></script>
    
    <!-- Main emulator (will now use Z80 via adapter) -->
    <script language="JavaScript" src="./src/main.js" type="text/javascript"></script>

    <script type="text/javascript">
    // Debug: track state
    var frameCount = 0;
    var running = false;
    var debugInterval = null;
    
    function updateDebug() {
        if (!window.v06c || !window.v06c.cpu) return;
        
        var cpu = window.v06c.cpu;
        var mem = window.v06c.memory;
        
        // Update PC/SP
        document.getElementById('dbg-pc').textContent = cpu.pc.toString(16).toUpperCase().padStart(4, '0');
        document.getElementById('dbg-sp').textContent = cpu.sp.toString(16).toUpperCase().padStart(4, '0');
        document.getElementById('dbg-frames').textContent = frameCount;
        
        // Count non-zero bytes in soft VRAM (8000-BFFF)
        var vramNonZero = 0;
        for (var i = 0x8000; i < 0xC000; i++) {
            if (mem.read(i, false) !== 0) vramNonZero++;
        }
        document.getElementById('dbg-vram').textContent = vramNonZero;
        
        // Count non-zero bytes in visible plane (E000-FFFF)
        var planeNonZero = 0;
        for (var i = 0xE000; i < 0x10000; i++) {
            if (mem.read(i, false) !== 0) planeNonZero++;
        }
        document.getElementById('dbg-plane').textContent = planeNonZero;
        
        // Status
        var status = running ? 'Running' : 'Stopped';
        if (cpu.pc >= 0x1000 && cpu.pc < 0x6849) {
            status += ' (in game code)';
        } else if (cpu.pc < 0x1000) {
            status += ' (in adapter)';
        }
        document.getElementById('dbg-status').textContent = status;
    }
    
    function toggleRun() {
        running = !running;
        if (running) {
            if (debugInterval) clearInterval(debugInterval);
            debugInterval = setInterval(updateDebug, 1000);
        }
    }
    
    function stepFrame() {
        if (window.v06c && window.v06c.onAnimationFrame) {
            window.v06c.onAnimationFrame();
            frameCount++;
            updateDebug();
        }
    }
    
    function reset() {
        if (window.v06c && window.v06c.cpu) {
            window.v06c.cpu.pc = 0x0100;  // Reset to boot entry
            frameCount = 0;
            updateDebug();
        }
    }
    
    // Load ROM on startup
    window.addEventListener('load', function() {
        // The emulator should auto-load basket.rom from URL param
        // or we can use the file API
        setTimeout(function() {
            updateDebug();
            document.getElementById('dbg-status').textContent = 'Ready - click Start/Stop';
        }, 1000);
        
        // Auto-start debug updates
        debugInterval = setInterval(updateDebug, 1000);
    });
    </script>
</body>
</html>
